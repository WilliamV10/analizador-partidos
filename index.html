<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0e13" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)" />
    <title>Analizador de partidos</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c5f23a'/%3E%3Cpath d='M8 24v-6M13 24V12M18 24V15M23 24V9' stroke='%230a0e13' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <script src="js/themeInit.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>

    <header class="topbar">
      <div class="topbar__inner">
        <button class="brand" type="button" data-nav="day">
          <span class="brand__logo" data-icon="logo" data-size="20"></span>
          <span class="brand__name">Analizador</span>
        </button>
        <nav class="topnav" aria-label="Secciones" data-topnav></nav>
        <div class="topbar__actions">
          <button class="icon-button" type="button" data-theme-toggle aria-label="Cambiar tema"></button>
          <button class="icon-button hide-desktop" type="button" data-nav="history" aria-label="Historial" title="Historial">
            <span data-icon="history"></span>
          </button>
          <button class="icon-button hide-desktop" type="button" data-nav="load" aria-label="Cargar JSON" title="Cargar JSON">
            <span data-icon="upload"></span>
          </button>
          <button class="icon-button hide-desktop" type="button" data-copy-claude aria-label="Copiar para Claude" title="Copiar para Claude">
            <span data-icon="copy"></span>
          </button>
          <button class="button button--sm hide-mobile" type="button" data-nav="load">
            <span data-icon="upload" data-size="18"></span>Cargar JSON
          </button>
          <button class="button button--sm button--primary hide-mobile" type="button" data-copy-claude>
            <span data-icon="copy" data-size="18"></span>Copiar para Claude
          </button>
        </div>
      </div>
    </header>

    <main id="main" class="app" tabindex="-1">
      <!-- Inicio y carga: formulario fijo (no se redibuja, así no se pierde lo pegado). -->
      <section id="screen-load" class="screen" aria-labelledby="load-title" hidden>
        <header class="page-head">
          <div class="page-head__text">
            <h1 id="load-title" class="display display--xl">Carga los partidos</h1>
            <p class="muted">Sube o pega el JSON del script de Sofascore. Todo se calcula en tu navegador; nada sale de él.</p>
          </div>
        </header>

        <form class="stack" data-loader-form>
          <label class="drop-zone" data-drop-zone>
            <input class="visually-hidden" type="file" accept=".json,application/json" multiple data-file-input />
            <span class="drop-zone__icon" data-icon="upload" data-size="24"></span>
            <span class="drop-zone__title">Elegir archivos .json</span>
            <span class="note">Puedes elegir varios a la vez o arrastrarlos aquí</span>
            <span class="drop-zone__files" data-file-list></span>
          </label>

          <label class="field">
            <span class="eyebrow">O pega el JSON</span>
            <textarea class="textarea" data-json-input rows="3" spellcheck="false" placeholder='{"version":4,"partidos":[…]}'></textarea>
          </label>

          <div class="field">
            <span class="eyebrow" id="mode-label">Modo</span>
            <div class="segmented" role="group" aria-labelledby="mode-label" data-mode>
              <button class="segmented__option" type="button" data-value="auto" aria-pressed="true">Auto</button>
              <button class="segmented__option" type="button" data-value="single" aria-pressed="false">Un partido</button>
              <button class="segmented__option" type="button" data-value="multi" aria-pressed="false">Varios</button>
            </div>
          </div>

          <div class="button-row button-row--split">
            <button class="button button--lg" type="reset">Limpiar</button>
            <button class="button button--lg button--primary" type="submit" data-submit>
              Analizar <span data-icon="arrow" data-size="20"></span>
            </button>
          </div>
          <p class="status" data-status role="status" aria-live="polite"></p>
        </form>

        <div data-last-session></div>
        <p class="disclaimer">Son probabilidades, no certezas. Apuesta solo lo que estés dispuesto a perder.</p>
      </section>

      <!-- Resto de pantallas: se dibujan desde js/ui/screens/. -->
      <section id="screen-view" class="screen" aria-live="polite" hidden></section>
    </main>

    <nav class="bottom-nav" aria-label="Secciones" data-bottomnav></nav>

    <div class="toast" data-toast role="status" aria-live="polite" hidden></div>

    <dialog id="bet-dialog" class="dialog" aria-labelledby="bet-title">
      <form class="dialog__form" method="dialog" data-bet-form>
        <header class="dialog__head">
          <h2 id="bet-title" class="display display--sm">Registrar apuesta</h2>
          <button class="icon-button" type="submit" value="close" aria-label="Cerrar"><span data-icon="close"></span></button>
        </header>
        <div class="dialog__pick" data-bet-pick></div>
        <div class="dialog__grid">
          <label class="field">
            <span class="field__label">Cuota tomada</span>
            <input class="input" type="number" inputmode="decimal" min="1.01" step="0.01" required data-bet-odds />
          </label>
          <label class="field">
            <span class="field__label">Monto (unidades)</span>
            <input class="input" type="number" inputmode="decimal" min="0.01" step="0.25" required data-bet-stake />
          </label>
        </div>
        <div class="button-row">
          <button class="button button--danger" type="button" data-bet-remove>Quitar registro</button>
          <button class="button button--primary" type="button" data-bet-save>Guardar</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
